# Set $TERM inside tmux sessions — tmux-256color is the tmux-native terminfo with the best capability support
set -g default-terminal "tmux-256color"
# Tell tmux that the *outer* terminal (xterm-256color) supports true 24-bit color (Tc flag)
set -ga terminal-overrides ",xterm-256color:Tc"

# ── Prefix key ────────────────────────────────────────────────────────────────

# Remove the default prefix (Ctrl-b)
unbind C-b
# Set the new prefix to Ctrl-t
set-option -g prefix C-t
# Disable the window where you can keep holding a key to repeat a bound command
set-option -g repeat-time 0
# Forward focus events (FocusIn/FocusOut) to programs running inside panes — needed for vim autoread etc.
set-option -g focus-events on

#### Key bindings

# Use vi-style keys in copy mode (e.g. j/k to scroll, v to select)
set-window-option -g mode-keys vi

# Reload settings
# prefix+r: reload this config file and show a confirmation message
bind r source-file ~/.config/tmux/tmux.conf
# prefix+e: kill all panes except the current one
bind -r e kill-pane -a

# Moving window
# Ctrl+Shift+Left: swap the current window one position to the left, then move focus to it
bind-key -n C-S-Left swap-window -t -1 \; previous-window
# Ctrl+Shift+Right: swap the current window one position to the right, then move focus to it
bind-key -n C-S-Right swap-window -t +1 \; next-window

#### basic settings

# Align window list to the left side of the status bar
set-option -g status-justify "left"

# ── Colors (Blowington theme) ─────────────────────────────────────────────────

# Status bar foreground: warm sandy beige
set-option -g status-fg "#c7b18f"
# Status bar background: deep dark teal
set-option -g status-bg "#062626"
# Active pane border color: sandy accent; inactive border inherits default
set -g pane-active-border-style fg="#b4a489",bg=default
# Inactive pane text color (dims unfocused panes slightly)
set -g window-style fg="#c7b18f",bg=default
# Active pane text color: near-white so the focused pane stands out
set -g window-active-style fg="#c7b18f",bg=default

# ── Misc ──────────────────────────────────────────────────────────────────────

# Number of lines of scrollback history to keep per pane
set-option -g history-limit 64096

# Reduce the delay after pressing Escape (important for vim — default 500ms causes lag)
set -sg escape-time 10

# ── Title bar ─────────────────────────────────────────────────────────────────

# Allow tmux to set the terminal window/tab title
set -g set-titles on
# Set the title to the current pane's running command or shell title
set -g set-titles-string "#T"

# ── Imports ───────────────────────────────────────────────────────────────────

# Load color/border theme (pane borders, status colors, clock, etc.)
source ~/.config/tmux/theme.conf
# Load status bar layout and segment definitions
source ~/.config/tmux/statusline.conf

# ── Popups ────────────────────────────────────────────────────────────────────

# prefix+g: open lazygit in a floating popup (80% width/height) rooted at the current pane's directory
bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit

# ── Plugins (via TPM) ─────────────────────────────────────────────────────────

# TPM — Tmux Plugin Manager (bootstraps and manages plugins)
set -g @plugin 'tmux-plugins/tpm'
# tmux-pain-control — adds standard pane navigation/resize bindings (prefix+h/j/k/l etc.)
set -g @plugin 'tmux-plugins/tmux-pain-control'
# Initialize TPM and load all plugins (must be last line in plugin section)
run '~/.tmux/plugins/tpm/tpm'
