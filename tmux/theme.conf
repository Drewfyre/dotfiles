#### COLOUR (Blowington)

# default statusbar colors
set-option -g status-style bg=#062626,fg=#c7b18f,default

# default window title colors
set-window-option -g window-status-style fg=#c7b18f,bg=#062626,dim

# active window title colors
set-window-option -g window-status-current-style fg=#b4a489,bg=default,bright

# pane border
set-option -g pane-border-style fg=#0a2424
set-option -g pane-active-border-style fg=#b4a489,bg=#062626

# message text
set-option -g message-style bg=#062626,fg=#c7b18f

# pane number display
set-option -g display-panes-active-colour "#8adc8f"
set-option -g display-panes-colour "#b4a489"

# clock
set-window-option -g clock-mode-colour "#8adc8f"
