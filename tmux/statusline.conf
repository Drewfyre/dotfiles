# vim: ft=tmux
set -g mode-style "fg=#b4a489,bg=#0a2424"

set -g message-style "fg=#b4a489,bg=#0a2424"
set -g message-command-style "fg=#b4a489,bg=#0a2424"

set -g pane-border-style "fg=#0a2424"
set -g pane-active-border-style "fg=#b4a489"

set -g status "on"
set -g status-interval 1
set -g status-justify "left"

set -g status-style "fg=#3d6060,bg=#0a2424"

set -g status-bg "#062626"

set -g status-left-length "100"
set -g status-right-length "100"

set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#[fg=#0a2424,bg=#b4a489,bold] #S:#I.#P #[fg=#b4a489,bg=#7a9080,nobold,nounderscore,noitalics]#[fg=#062626,bg=#7a9080,bold] #(whoami) #[fg=#7a9080,bg=#062626]"
set -g status-right "#[fg=#3d6060,bg=#062626,nobold,nounderscore,noitalics]#[fg=#7a9080,bg=#3d6060]#[fg=#4a7070,bg=#3d6060,nobold,nounderscore,noitalics]#[fg=#7a9080,bg=#4a7070]#[fg=#7a9080,bg=#4a7070,nobold,nounderscore,noitalics]#[fg=#062626,bg=#7a9080,bold] #h "

setw -g window-status-activity-style "underscore,fg=#c7b18f,bg=#062626"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#c7b18f,bg=#062626"
setw -g window-status-format '#[fg=#062626,bg=#062626]#[default] #I  #{b:pane_current_path} #[fg=#062626,bg=#062626,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#062626,bg=#b4a489]#[fg=#8adc8f,bg=#b4a489] #I #[fg=#b4a489,bg=#8adc8f] #{b:pane_current_path} #[fg=#8adc8f,bg=#062626,nobold]'
